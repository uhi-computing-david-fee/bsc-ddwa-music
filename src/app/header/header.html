<header class="app-header">
  <div class="app-header__inner">
    <a class="brand" href="#">
      <div class="brand__mark">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="brand__text">
        <span class="brand__name">SoundShelf</span>
        <span class="brand__tagline">Your music library</span>
      </div>
    </a>

    <div class="library-summary">
      <div class="library-summary__item">
        <span class="library-summary__value">{{ trackCount }}</span>
        <span class="library-summary__label">Tracks</span>
      </div>

      <div class="library-summary__divider"></div>

      <div class="library-summary__item">
        <span class="library-summary__value library-summary__value--favourite">
          <span>♥</span>
          {{ favouriteCount }}
        </span>
        <span class="library-summary__label">Favourites</span>
      </div>
    </div>
  </div>
</header>
